
services:
  api:
    build: .
    image: express-mail-api
    container_name: express_mail_api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "${MAPPING_API_PORT}:8000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: express_mail_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "${MAPPING_DB_PORT}:5432"
    volumes:
      - data_express_mail:/var/lib/postgresql/data

volumes:
  data_express_mail:
