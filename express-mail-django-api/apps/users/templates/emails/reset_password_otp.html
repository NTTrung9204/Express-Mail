<div style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #fff8f2; padding: 30px; text-align: center; color: #333;">
  <div style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); padding: 30px 25px;">

    <!-- Logo -->
    <img src="https://pbl6-django-bucket.s3.ap-southeast-1.amazonaws.com/static/logos/fast_delivery.jpg"
         alt="Fast Delivery Logo"
         style="max-width: 140px; margin-bottom: 20px; border-radius: 8px;">

    <!-- Header -->
    <h2 style="color: #f57c00; margin-bottom: 18px; font-weight: 600;">Đặt lại mật khẩu</h2>

    <!-- Message -->
    <p style="font-size: 15px; line-height: 1.7; margin-bottom: 20px; color: #444;">
      Xin chào,<br>
      Bạn đã yêu cầu đặt lại mật khẩu cho tài khoản của mình.
    </p>

    <!-- OTP Section -->
    <p style="font-size: 15px; margin-bottom: 10px; color: #333;">Mã OTP của bạn là:</p>

    <div style="display: inline-block; background: #fff3e0; border: 1px solid #ffe0b2; padding: 14px 26px; border-radius: 10px; font-size: 24px; font-weight: bold; letter-spacing: 3px; color: #e65100;">
      {{ otp }}
    </div>

    <!-- Expiration + Note -->
    <p style="font-size: 14px; color: #666; margin-top: 22px; line-height: 1.6;">
      Mã này sẽ hết hạn sau <strong>5 phút</strong>.<br>
      Vui lòng <strong>không chia sẻ</strong> mã này với bất kỳ ai.
    </p>

    <!-- Divider -->
    <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">

    <!-- Footer -->
    <p style="font-size: 14px; color: #555; margin-bottom: 0;">
      Trân trọng,<br>
      <strong style="color: #f57c00;">{{ app_name }} Team</strong>
    </p>
  </div>

  <!-- Disclaimer -->
  <p style="font-size: 12px; color: #999; margin-top: 20px;">
    &copy; {{ current_year }} {{ app_name }}. All rights reserved.
  </p>
</div>
