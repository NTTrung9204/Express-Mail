version: '3.8'

services:
  system-shop:
    build:
      context: .
      dockerfile: dockerfile
    container_name: express-mail-shop
    ports:
      - "4175:4173"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - express-mail-network

networks:
  express-mail-network:
    driver: bridge