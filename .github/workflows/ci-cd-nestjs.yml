name: CI/CD - NestJS

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: CI (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./express-mail-nestjs-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./express-mail-nestjs-api

      - name: Lint
        run: npm run lint --if-present
        working-directory: ./express-mail-nestjs-api

      - name: Run tests
        run: npm test --if-present
        working-directory: ./express-mail-nestjs-api

      - name: Build
        run: npm run build --if-present
        working-directory: ./express-mail-nestjs-api

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-build
          path: ./express-mail-nestjs-api/dist

  docker-deploy:
    name: Build, Push & Deploy with Docker Compose
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build, push and run containers
        working-directory: ./express-mail-nestjs-api
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_ENV: ${{ secrets.APP_ENV }}
          SWAGGER_USER: ${{ secrets.SWAGGER_USER }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            IMAGE_TAG=pr-${{ github.event.pull_request.number }}
            COMPOSE_PROJECT_NAME=pr${{ github.event.pull_request.number }}
            export APP_PORT=$((APP_PORT + 1000))
          else
            IMAGE_TAG=latest
            COMPOSE_PROJECT_NAME=prod
          fi

          docker-compose -f docker-compose.yml build --build-arg IMAGE_TAG=$IMAGE_TAG
          docker-compose -f docker-compose.yml push
          docker-compose -f docker-compose.yml pull

          docker-compose -f docker-compose.yml down || true
          docker-compose -f docker-compose.yml up -d

      - name: Clean up unused images
        run: docker image prune -af
