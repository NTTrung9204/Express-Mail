name: CI/CD - NestJS

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: CI (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./express-mail-nestjs-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./express-mail-nestjs-api

      - name: Lint
        run: npm run lint --if-present
        working-directory: ./express-mail-nestjs-api

      - name: Run tests
        run: npm test --if-present
        working-directory: ./express-mail-nestjs-api

      - name: Build
        run: npm run build --if-present
        working-directory: ./express-mail-nestjs-api

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-build
          path: ./express-mail-nestjs-api/dist

  docker-deploy:
    name: Build & Push Docker image (main & develop)
    needs: ci
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NestJS Docker image
        run: docker build -f Dockerfile.dev -t nttrung9204/express-mail-nestjs-api:latest ./express-mail-nestjs-api

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push NestJS Docker image
        run: docker push nttrung9204/express-mail-nestjs-api:latest

      - name: Pull NestJS Docker image
        run: docker pull nttrung9204/express-mail-nestjs-api:latest

      - name: Stop and remove old container
        run: |
          docker stop express-mail-nestjs-api || true
          docker rm express-mail-nestjs-api || true

      - name: Start new container
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_ENV: ${{ secrets.APP_ENV }}
          SWAGGER_USER: ${{ secrets.SWAGGER_USER }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
        run: |
          docker run -d \
            --name express-mail-nestjs-api \
            -e DB_HOST=$DB_HOST \
            -e DB_PORT=$DB_PORT \
            -e DB_USERNAME=$DB_USERNAME \
            -e DB_PASSWORD=$DB_PASSWORD \
            -e DB_DATABASE=$DB_DATABASE \
            -e APP_PORT=$APP_PORT \
            -e APP_ENV=$APP_ENV \
            -e SWAGGER_USER=$SWAGGER_USER \
            -e SWAGGER_PASSWORD=$SWAGGER_PASSWORD \
            -e JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET \
            -p $APP_PORT:$APP_PORT \
            nttrung9204/express-mail-nestjs-api:latest

      - name: Clean up unused images
        run: docker image prune -af