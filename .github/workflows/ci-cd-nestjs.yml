name: CI/CD - NestJS

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: CI (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./express-mail-nestjs-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./express-mail-nestjs-api

      - name: Lint
        run: npm run lint --if-present
        working-directory: ./express-mail-nestjs-api

      - name: Run tests
        run: npm test --if-present
        working-directory: ./express-mail-nestjs-api

      - name: Build
        run: npm run build --if-present
        working-directory: ./express-mail-nestjs-api

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-build
          path: ./express-mail-nestjs-api/dist
  docker-deploy:
    name: Build & Push Docker image (main & develop)
    needs: ci
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./express-mail-nestjs-api
          file: ./express-mail-nestjs-api/Dockerfile.dev
          push: true
          tags: |
            ghcr.io/${{ toLower(github.repository_owner) }}/express-mail-nestjs-api:latest
            ghcr.io/${{ toLower(github.repository_owner) }}/express-mail-nestjs-api:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Output image info
        run: |
          echo "Image pushed to:"
          echo " - ghcr.io/${{ toLower(github.repository_owner) }}/express-mail-nestjs-api:latest"
          echo " - ghcr.io/${{ toLower(github.repository_owner) }}/express-mail-nestjs-api:${{ github.sha }}"
